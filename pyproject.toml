[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flybrain"
version = "0.1.0"
description = "Drosophila whole-brain simulation: FlyWire connectome, Brian2 spiking network, graph ML and connectome-constrained training."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "marcelyeo0" }]
keywords = ["drosophila", "connectome", "flywire", "spiking-neural-network", "brian2", "neuroscience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "networkx>=3.1",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "brian2>=2.7",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
# closed-loop body (MuJoCo NeuroMechFly) + what the NeuroFly submodule needs
sim = [
    "torch>=2.2",
    "flygym==1.2.1",
    "mujoco==3.2.7",
    "dm_control==1.0.27",
    "flyvis>=1.2",
    "h5py>=3.10",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
    "opencv-python-headless>=4.8",
    "python-dotenv>=1.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
notebooks = ["jupyterlab>=4", "seaborn>=0.13"]

[project.scripts]
flybrain = "flybrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running simulations (deselect with -m 'not slow')"]
